# Lokalno ili na sopstvenom serveru:  JWT_SECRET=... ADMIN_PASSWORD=... docker compose up -d --build
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: poker
      POSTGRES_PASSWORD: poker
      POSTGRES_DB: poker
    volumes:
      - dbdata:/var/lib/postgresql/data
    restart: unless-stopped

  server:
    build: .
    depends_on: [db]
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://poker:poker@db:5432/poker?schema=public
      JWT_SECRET: ${JWT_SECRET:?postavi JWT_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?postavi ADMIN_PASSWORD}
    restart: unless-stopped

volumes:
  dbdata:
